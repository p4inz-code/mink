[package]
name = "dbshell"
version = "0.1.0"
edition = "2021"
description = "M4 W3 dbshell — Rust port"
publish = false

[[bin]]
name = "dbshell"
path = "src/main.rs"

[dependencies]
# Resolved and pinned in Cargo.lock: rusqlite 0.32.1 with bundled SQLite
# (libsqlite3-sys 0.30.1). The harness builds with --offline from the cache.
rusqlite = { version = "=0.32.1", features = ["bundled"] }
